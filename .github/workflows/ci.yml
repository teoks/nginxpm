name: CI

on:
  workflow_dispatch:

  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'test/**'
      - 'scripts/**'
      - 'package-lock.json'
      - 'frontend/package.json'
      - 'frontend/yarn.lock'
      - 'backend/package.json'
      - 'backend/yarn.lock'
      - '.github/workflows/ci.yml'

  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'test/**'
      - 'scripts/**'
      - 'package-lock.json'
      - 'frontend/package.json'
      - 'frontend/yarn.lock'
      - 'backend/package.json'
      - 'backend/yarn.lock'
      - '.github/workflows/ci.yml'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'yarn'
          cache-dependency-path: frontend/yarn.lock

      - name: Install frontend dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile

      - name: Compile frontend locales
        working-directory: frontend
        run: yarn locale-compile

      - name: Run frontend tests
        working-directory: frontend
        run: yarn vitest run --no-color

      - name: Build frontend
        working-directory: frontend
        run: yarn build

  backend:
    name: Backend lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'yarn'
          cache-dependency-path: backend/yarn.lock

      - name: Install backend dependencies
        working-directory: backend
        run: yarn install --frozen-lockfile

      - name: Lint backend
        working-directory: backend
        run: yarn lint
