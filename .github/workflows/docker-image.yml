name: Docker Image

on:
  workflow_dispatch:

  schedule:
    - cron: '0 3 * * 1'

  push:
    branches: [main]
    tags:
      - 'v*.*.*'
    paths:
      - 'docker/**'
      - 'frontend/**'
      - 'backend/**'
      - 'frontend/package.json'
      - 'frontend/yarn.lock'
      - 'backend/package.json'
      - 'backend/yarn.lock'
      - '.github/workflows/docker-image.yml'

  pull_request:
    branches: [main]
    paths:
      - 'docker/**'
      - 'frontend/**'
      - 'backend/**'
      - 'frontend/package.json'
      - 'frontend/yarn.lock'
      - 'backend/package.json'
      - 'backend/yarn.lock'
      - '.github/workflows/docker-image.yml'

concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE_NAME: teoks/nginxpm

jobs:
  frontend-build:
    name: Build frontend artifact
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'yarn'
          cache-dependency-path: frontend/yarn.lock

      - name: Install frontend dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile

      - name: Compile frontend locales
        working-directory: frontend
        run: yarn locale-compile

      - name: Run frontend tests
        working-directory: frontend
        run: yarn vitest run --no-color

      - name: Build frontend
        working-directory: frontend
        run: yarn build

      - name: Upload frontend dist
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v4.4.0
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 1

  backend-lint:
    name: Lint backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'yarn'
          cache-dependency-path: backend/yarn.lock

      - name: Install backend dependencies
        working-directory: backend
        run: yarn install --frozen-lockfile

      - name: Lint backend
        working-directory: backend
        run: yarn lint

  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: [frontend-build, backend-lint]
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.vars.outputs.image_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download frontend dist
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Derive image tag
        id: vars
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "image_tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_EVENT_NAME}" == "schedule" ]]; then
            echo "image_tag=nightly" >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            echo "image_tag=pr-${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          else
            echo "image_tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v3.3.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v3.11.0

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v3.4.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a880e428804 # v5.5.1
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.vars.outputs.image_tag }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v6.16.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_VERSION=${{ github.ref_name }}
            BUILD_COMMIT=${{ github.sha }}
            BUILD_DATE=${{ github.run_id }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  verify-image:
    name: Verify published image
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name != 'pull_request'

    steps:
      - name: Pull and verify runtime versions
        shell: bash
        run: |
          IMAGE="${{ env.IMAGE_NAME }}:${{ needs.docker.outputs.image_tag }}"
          docker pull "$IMAGE"
          docker run --rm "$IMAGE" nginx -v
          docker run --rm "$IMAGE" node --version
          docker run --rm "$IMAGE" openssl version
          docker run --rm "$IMAGE" certbot --version
